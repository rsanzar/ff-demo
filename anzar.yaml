apps:
  ff-demo:
    ci:
      jobs:
        - name: prepare-code
          runtime: ff-latest
          tshirt: standard
          commands:
            # Allow virtual memory overcommit in CI if running in a 64MB VM
            - sysctl -w vm.overcommit_memory=1
            - cp server.js /app/server.js

    cd:
      runtime: ff-latest
      tshirt: standard
      type: warm
      start_commands:
        # 1. Disable strict virtual address accounting & shrink the 8MB root reserve
        - sysctl -w vm.overcommit_memory=1
        - sysctl -w vm.admin_reserve_kbytes=512
        - sysctl -w vm.user_reserve_kbytes=512

        # 2. Tune the Linux TCP stack dynamically
        - sysctl -w net.ipv4.ip_local_port_range="1024 65535"
        - sysctl -w net.ipv4.tcp_tw_reuse=1
        - sysctl -w net.core.somaxconn=65535
        - sysctl -w net.ipv4.tcp_max_syn_backlog=65535

        # 3. Cap thread stack virtual reservation (2MB instead of 8MB) and launch ff
        - sh -c 'ulimit -n 65535 && ulimit -s 2048 && exec ff /app/server.js --allow-all'
      port: 3000
      connection_limit: 500
