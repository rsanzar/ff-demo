    apps:
      ff-demo:
        ci:
          jobs:
            - name: prepare-code
              runtime: ff-latest
              tshirt: standard
              commands:
                - sysctl -w vm.overcommit_memory=1
                - 'echo "CI check -> CI_SECRET=${CI_SECRET} | CD_SECRET=${CD_SECRET}"'
                - 'printf "{\"ci_secret\":\"%s\",\"cd_secret\":\"%s\"}\n" "$CI_SECRET"
                "$CD_SECRET" > /app/ci_check.json'
                - cp server.js /app/server.js

        cd:
          runtime: ff-latest
          tshirt: standard
          type: warm
          start_commands:
            - sysctl -w vm.overcommit_memory=1
            - sysctl -w vm.admin_reserve_kbytes=512
            - sysctl -w vm.user_reserve_kbytes=512
            - sysctl -w net.ipv4.ip_local_port_range="1024 65535"
            - sysctl -w net.ipv4.tcp_tw_reuse=1
            - sysctl -w net.core.somaxconn=65535
            - sysctl -w net.ipv4.tcp_max_syn_backlog=65535
            - sh -c 'ulimit -n 65535 && ulimit -s 2048 && exec ff /app/server.js --allow-all'
          port: 3000
          connection_limit: 500
