    apps:
      ff-demo:
        ci:
          jobs:
            - name: prepare-code
              runtime: ff-latest
              tshirt: standard
              commands:
                - sysctl -w vm.overcommit_memory=1
                # Verify CI_SECRET is present in CI and CD_SECRET is NOT leaked into CI:
                - ff -e 'const ok = Boolean(process.env.CI_SECRET); const cdLeaked = Boolean(process.env.CD_SECRET); console.log("CI check -> CI_SECRET:", ok, "CD_SECRET leaked:",
                cdLeaked); fs.writeFile("/app/ci_check.json", JSON.stringify({ ci_secret_present_in_ci: ok, ci_secret_preview: (process.env.CI_SECRET || "").slice(0, 10) + "...",
                cd_secret_leaked_into_ci: cdLeaked }));' --allow-all
                - cp server.js /app/server.js

        cd:
          runtime: ff-latest
          tshirt: standard
          type: warm
          start_commands:
            - sysctl -w vm.overcommit_memory=1
            - sysctl -w vm.admin_reserve_kbytes=512
            - sysctl -w vm.user_reserve_kbytes=512
            - sysctl -w net.ipv4.ip_local_port_range="1024 65535"
            - sysctl -w net.ipv4.tcp_tw_reuse=1
            - sysctl -w net.core.somaxconn=65535
            - sysctl -w net.ipv4.tcp_max_syn_backlog=65535
            - sh -c 'ulimit -n 65535 && ulimit -s 2048 && exec ff /app/server.js --allow-all'
          port: 3000
          connection_limit: 500
